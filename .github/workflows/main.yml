name: Build Android core
on: workflow_dispatch
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with ndk-build
        run: |
          export NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME}}"
          "$NDK/ndk-build" -C Libretro/jni APP_ABI="arm64-v8a armeabi-v7a" -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: mesen-android-core
          path: Libretro/libs/**/libretro.so
